<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
        <!-- 
            style - ატრიბუტი გვეხმარება იმაში რომ გამოვიყენოთ inline css, style გვეხმარება იმაში რომ გავსტილოთ ჩვენი ელემენტი.

            color - არის ფერი რომლითაც ჩვენ ვცვლით ტექსტის ფერს.

            backgroud color - ცვლის უკანა ფონის ფერს.

            font-size - ცვლის ტექსტის ზომას.


            head - ნაწილი არის ინფორმაცია გვერდის შესახებ რასაც მომხმარებელი პირდაპირ ვერ ხედავს.

            img tag - ში ჩვენ ვწერთ ფოტოს მისამართს მაგრამ ეგ რომ მოხდეს ჩვენ ვიყენებთ atribute რომელსაც ფოტო გამოაქვს საიტზე და მას ჰქვია src ატრიბუტი.

            a href - ში ჩვენ ვწერთ საიტის მისამართს და მაგის დახმარებით ერთი საიტიდან მეორე საიტში გადავდივართ მაგრამ ეგ რომ მოხდეს მაგისთვის ჩვენ გვეხმარება atribute რომლის სახელიც არის href ატრიბუტი.
            

            body tag - ში ჩვენ ვწერთ თეგებს რომელიც აისახება საიტზე, ანუ ბოდი არის საიტის ტანი.

            h1 - არის თეგი რომელიც გვხმარება რომ დიდი ტექსტი გამოვიტანოთ საიტზე და მაგას ძირითადად სათაურებისთვის იყენებენ.

            button tag - არის ღილაკი რისი დახმარებითაც ჩვენ შეგვიძლია საიტზე ღილაკების დახმარებით სხვადასხვა რამე გავხსნათ ან გადავაადგილოთ.

            paragraph tag - არის თეგი რომელიც გვეხმარება შევქმნათ ტექსური წინადადებები და საიტზე გამოვიტანოთ.
        -->
    </body>
</html>
