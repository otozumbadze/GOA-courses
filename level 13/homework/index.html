<!--
 
Attribute - ში შედის src, href, alt, height, width. 
 
src - ში ვწერთ ნებისმიერ ლინკს რომ გამოვიდეს ჩვენს საიტზე(src არის Required)

href - ში ჩვენ ლინკებს ვაერთებთ საიტებზე და წილაკზე დაჭერით ჩვენ გადავდივართ იმ საიტზე რაზეც ლინკი შევაერთეთ (href არის Required)

alt - ში ჩვენ ვწერთ თუ რა არის გამოსახული ფოტოზე თუ ფოტოს რამე ხარვეზი აქვს (alt არის Optional)

height - ში ჩვენ სურათი იქნება თუ რაიმე ჩარჩო ჩვენ height - ით სიმაღლეში ვადიდებთ.

width - ში ჩვენ სურათი იქნება თუ ჩარჩო ჩვენ width - ით სიგანეში ვზრდით.


Single-page არის უბრალოდ ერთი-ვებ საიტი.

Multi-page არის ბევრი ვებ-საიტი.

-->
