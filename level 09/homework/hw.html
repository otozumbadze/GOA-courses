<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<body>
    

<!--
    src - img tag-ში ვწერთ და მის ბრჭყალებში ვწერთ ფოტოს address რისი მეშვეობითაც ჩვენ საიტზე შემოგვაქვს ფოტო სურათი.

    alt - img tag-ში ვწერთ და მის ბრჭყალებს შუაში ვწერთ ტექსტს რომელიც ახასიათებს ფოტოს რაც ჩვენ ჩავსვით საიტში იმისთვის რომ მომხმარებელს მივახვედროთ თუ რა ფოტო იყო შემოტანილი.


    width - სიგანეში ზრდის ფოტოს, ვიდეოს.

    height - სიმაღლეში ზრდის ფოტოს, ვიდეოს.


i ანუ italic ტექსტს ხრის ცოტათი და ძან კარგად გამოსაჩენია.

u ანუ underline ტექსტს დაბლა ხაზს უსვამს.

b ანუ bold ტექსტს ამუქებს.

strong ტექსტს ამუქებს როგორც bold.

em ტექსტს ხრის როგორც italic.



i ანუ italic და ამაში ის განსხვავება რომ italic-ს მარტო ტექსტის დახრა შეუძლია.

u ანუ underline და ამაში ის განსხვავება რომ underline-ს მარტო ტეექსტის ქვეშ ხაზის გასმა შეუძლია.

b ანუ bold და ამაში ის განსხვავება რომ bold-ს მარტო ტექსტის გამუქება შეუძლია.

strong-ში ის განსხვავებაა რომ ტექსტს ამუქებს მაგრამ ეს ეხმარება უსინათლოებს რომ ტექსტი წაიკითხონ.

em-ში და italic გვანან ერთმანეთს ორივე ხრის ტექსტს.


indentation - არის კედლიდან დაშორება.
-->



</body>
</html>
