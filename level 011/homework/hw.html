<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!--   
    a - თეგი გამოიყენება ლინკების შესაქმნელად (ბმულების). ამის დახმარებით ჩვენ შეგვიძლია რომ გადავიდეთ ვებგვერდებზე ან იმავე ვებგვერდის სხვა ნაწილზე.
    href - განსაზღვრავს თუ სად მიდის ლინკი ანუ ლინკის მისამართს.
-->

<!-- HyperText არის ტექსტი, რომელიც შეიცავს ბმულებს (ლინკებს) სხვა გვერდებზე ან რესურსებზე, -->
<!-- ანუ ჩვეულებრივი ტექსტი, მაგრამ შეგიძლია მასზე დაჭერით სხვა ადგილას გადახვიდე. -->


<!-- HyperLink არის თავად ბმული (ლინკი), რომელზეც დაკლიკებისას გადაგიყვანს სხვა გვერდზე ან ფაილზე, -->
<!-- მაგალითად <a> თეგში შექმნილი ლინკი არის HyperLink. -->

<!--
    html ჩვენ გვაქვს 2 სახის list - ები ესენი არიან unordered list ( დაულაგებელი სია) და ordered list (დალაგებული სია).
-->

<!-- unordered list გამოიყენება როცა ელემენტებს თანმიმდევრობა არ აქვს (წერტილებით გამოისახება). -->

<!-- ordered list გამოიყენება როცა ელემენტებს აქვს თანმიმდევრობა (რიცხვებით გამოისახება). -->




</body>
</html>
