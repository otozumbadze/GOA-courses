<!--
   1) ახსენით რა არის box model და რამდენი შრისგან შედგება ის. ახსენით თითოეული შრე.

იგი შედგება 4 შრისგან:

1. Content – ელემენტის შიგთავსი (ტექსტი/სურათი)
2. Padding – შიდა დაშორება content-სა და border-ს შორის
3. Border – ელემენტის ჩარჩო
4. Margin – გარე დაშორება სხვა ელემენტებთან


2) ახსენით რა არის CSS reset, როგორ იწერება ეს და რას აკეთებს box-sizing: border-box.

1. CSS Reset → შლის ბრაუზერის default სტილებს (margin, padding და სხვ.)
2. box-sizing: border-box → რაც ზომას დაუწერ (width/height), ეგ არის საბოლოო ზომა (padding და border უკვე შიგნით ითვლება).
-->

<div>
    <p>CSS Box-Model Property</p>

    <h2>Content</h2>

</div>
